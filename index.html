    <title>Keerthan Karumudi — Skeptical Optimist</title>
    <!--
      GitHub Pages SPA redirect trick (see public/404.html). Decodes the
      path GitHub's 404 page re-encoded into a query string, before React
      Router mounts, so deep links to routes like /work or /writing work
      on a static host with BrowserRouter (clean URLs, no HashRouter).
      https://github.com/rafgraph/spa-github-pages
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
